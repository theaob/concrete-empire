// Android shell: full-screen WebView + Google Play Games Services v2.
// Values come from build.sh (-P...) so its config block stays the single place for name, id and version.
plugins {
    id 'com.android.application' version '8.11.1'
}

def prop = { String k, String d -> project.hasProperty(k) ? project.property(k).toString() : d }

android {
    namespace 'com.onur.concreteempire'           // Java package; the app id below can differ
    compileSdk 36
    buildToolsVersion prop('buildTools', '36.0.0')

    defaultConfig {
        applicationId prop('appId', 'com.onur.concreteempire')
        minSdk prop('minSdk', '24').toInteger()
        targetSdk prop('targetSdk', '36').toInteger()
        versionCode prop('versionCode', '1').toInteger()
        versionName prop('versionName', '0')
        manifestPlaceholders = [appName: prop('appName', 'Concrete Empire')]
    }

    sourceSets {
        main {
            manifest.srcFile 'src/AndroidManifest.xml'
            java.srcDirs = ['src/java']
            res.srcDirs = ['src/res']
            assets.srcDirs = ['src/assets']
        }
    }

    // Signing: build.sh exports KEYSTORE / KSPASS / KEY_ALIAS (the release key, or a throwaway test key).
    signingConfigs {
        release {
            storeFile System.getenv('KEYSTORE') ? file(System.getenv('KEYSTORE')) : null
            storePassword System.getenv('KSPASS')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KSPASS')
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-games-v2:21.0.0'
}
